name: Android Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. گرفتن آخرین کد پروژه از ریپازیتوری
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. تنظیم محیط Node.js (نسخه 22)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. تنظیم محیط Java (نسخه 17) - قبل از sync کردن Capacitor
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. تنظیم Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. نصب تمام وابستگی‌های پروژه (npm packages)
      - name: Install dependencies
        run: npm ci

      # 6. Build کردن پروژه Nuxt برای حالت استاتیک (SPA)
      - name: Build Nuxt App
        run: npm run generate
        # env:
        #   NUXT_APP_MOBILE: 'true' # در صورت نیاز فعال کنید

      # 7. Sync کردن فایل‌های build شده Nuxt با پروژه Capacitor Android
      # این مرحله حالا پس از تنظیم JDK و SDK انجام می‌شود
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 8. فعال کردن قابلیت اجرای فایل gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 9. Build کردن فایل AAB (برای انتشار در Google Play / بازار)
      - name: Build Release AAB
        working-directory: android # وارد پوشه android شوید
        run: ./gradlew bundleRelease # برای APK از assembleRelease استفاده کنید

      # 10. آپلود خروجی build شده به عنوان Artifact
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/
