name: Build Capacitor App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # مرحله جدید: اعمال تنظیمات Java 17 به فایل capacitor-cordova-android-plugins/build.gradle قبل از sync
      - name: Prepare Capacitor Gradle files
        run: |
          # Create android/gradle.properties if it doesn't exist
          touch android/gradle.properties
          # Add the suppress warning line
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          # Ensure capacitor-cordova-android-plugins/build.gradle exists and modify it if needed
          if [ -f "android/capacitor-cordova-android-plugins/build.gradle" ]; then
            sed -i 's/sourceCompatibility JavaVersion.VERSION_21/sourceCompatibility JavaVersion.VERSION_17/g' android/capacitor-cordova-android-plugins/build.gradle
            sed -i 's/targetCompatibility JavaVersion.VERSION_21/targetCompatibility JavaVersion.VERSION_17/g' android/capacitor-cordova-android-plugins/build.gradle
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate Nuxt static build
        run: npm run generate

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
